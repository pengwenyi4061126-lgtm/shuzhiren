# Fixture reproducing CI #491 (run 41869137741, step 31): the compose-render
# step overrides CONTROL_PLANE_ENV_FILE with config/control-plane.example.env,
# which Compose resolves against infra/compose/. Tests overlay this directory on
# scripts/fixtures/ci-gates/workflow/. The compose file and compose env file are
# copied unchanged from dc2916e.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static-gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run ci:coverage:check
      - run: bash -n scripts/backup.sh
      - run: npm run membership:scopes:check
      - run: npm run governance:tenant-scope:check
      - run: npm run lint

  node-unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run unit:test

  python-gateway:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r runtime/gateway/requirements.lock
      - run: npm run runtime:gateway:config:test
      - run: python3 -m py_compile runtime/gateway/*.py scripts/test-runtime-gateway-config.py
      - run: python3 scripts/test-runtime-gateway-audio.py

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fixture
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate:integrity:test
      - run: npm run service-principals:integration
      - run: npm run db:migrate:lock:test
      - run: npm run db:verify -- --allow-privileged
      - run: npm run control-plane:integration
        env:
          RUN_CONTROL_PLANE_INTEGRATION_TESTS: "true"

  compose-render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --env-file config/control-plane-compose.example.env -f infra/compose/docker-compose.control-plane.yml config
        env:
          CONTROL_PLANE_ENV_FILE: config/control-plane.example.env
      - run: docker compose --env-file config/runtime.example.env --env-file config/runtime-gateway.example.env --env-file config/channel-adapter.example.env --env-file config/alert-notifier.example.env --profile output-probe --profile channel-adapter --profile alert-notifier --profile cosyvoice -f infra/compose/docker-compose.runtime.yml config

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --file apps/console/Dockerfile --tag fixture-console-ci .
      - run: docker build --file apps/console/Dockerfile --target migrator --tag fixture-console-migrator-ci .
      - run: docker build --file apps/worker/Dockerfile --tag fixture-worker-ci .
      - run: docker build --file runtime/gateway/Dockerfile --tag fixture-gateway-ci runtime/gateway
      - run: docker build --load --file runtime/livetalking/Dockerfile --tag fixture/livetalking:ci .
      - name: docker build runtime/cosyvoice (committed Miniforge pin)
        run: |
          url="$(jq -er '.url' runtime/cosyvoice/miniforge.json)"
          sha="$(jq -er '.sha256' runtime/cosyvoice/miniforge.json)"
          docker build --file runtime/cosyvoice/Dockerfile --build-arg MINIFORGE_URL="$url" --build-arg MINIFORGE_SHA256="$sha" --tag fixture-cosyvoice-ci .

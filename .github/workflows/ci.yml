name: CI

on:
  push:
  pull_request:

jobs:
  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shuzhiren
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shuzhiren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shuzhiren
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash -n scripts/check-runtime-host.sh
      - run: bash -n scripts/backup-runtime-gateway-state.sh
      - run: bash -n scripts/verify-runtime-gateway-state-backup.sh
      - run: bash scripts/check-runtime-host.sh --help
      - run: npm run deploy:check -- --allow-placeholders
      - run: npm run deploy:check:test
      - run: npm run control-plane:compose:check
      - run: docker compose --env-file config/control-plane-compose.example.env -f infra/compose/docker-compose.control-plane.yml config
        env:
          CONTROL_PLANE_ENV_FILE: config/control-plane.example.env
      - run: docker build --file apps/console/Dockerfile --tag shuzhiren-control-plane-ci .
      - run: docker build --file apps/runtime-worker/Dockerfile --tag shuzhiren-runtime-worker-ci .
      - run: docker build --file apps/runtime-observer/Dockerfile --tag shuzhiren-runtime-observer-ci .
      - run: docker build --file apps/output-probe/Dockerfile --tag shuzhiren-output-probe-ci .
      - run: docker build --file apps/channel-adapter/Dockerfile --tag shuzhiren-channel-adapter-ci .
      - run: docker build --file apps/alert-notifier/Dockerfile --tag shuzhiren-alert-notifier-ci .
      - run: npm run policy:red-team
      - run: npm run preflight:check
      - run: npm run lifecycle:authz:check
      - run: npm run command:confirmation:check
      - run: npm run service-ingest:auth:check
      - run: npm run start:ack:check
      - run: npm run runtime:watchdog:check
      - run: npm run runtime:outbox:check
      - run: npm run runtime:telemetry-alerts:check
      - run: npm run entitlement:check
      - run: npm run runtime:media:check
      - run: npm run runtime:voice:check
      - run: npm run runtime:journal:check
      - run: npm run runtime:images:check
      - run: npm run runtime:worker:config:test
      - run: npm run runtime:acceptance:test
      - run: npm run observer:runtime:test
      - run: npm run observer:targets:test
      - run: npm run observer:targets:apply:test
      - run: npm run output-probe:test
      - run: npm run channel-adapter:test
      - run: npm run alert-notifier:test
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r runtime/gateway/requirements.txt
      - run: python3 -m py_compile runtime/gateway/app.py runtime/gateway/audio.py
      - run: python3 scripts/test-runtime-gateway-audio.py
      - run: python3 scripts/test-runtime-gateway-concurrency.py
      - run: python3 scripts/test-runtime-gateway-state-backup.py
      - run: node --check apps/runtime-worker/index.mjs
      - run: node --check apps/runtime-observer/index.mjs
      - run: node --check apps/runtime-observer/targets.mjs
      - run: node --check apps/output-probe/index.mjs
      - run: node --check apps/channel-adapter/index.mjs
      - run: node --check apps/alert-notifier/index.mjs
      - run: npm run db:migrate
      - run: npm run db:verify -- --allow-privileged
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run control-plane:integration
        env:
          RUN_CONTROL_PLANE_INTEGRATION_TESTS: "true"

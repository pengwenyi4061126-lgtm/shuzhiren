name: CI

on:
  push:
  pull_request:

jobs:
  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shuzhiren
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shuzhiren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shuzhiren
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run deploy:check -- --allow-placeholders
      - run: python3 -m py_compile runtime/gateway/app.py
      - run: node --check apps/runtime-worker/index.mjs
      - run: npm run db:migrate
      - run: npm run db:verify -- --allow-privileged
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  static-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run ci:coverage:check
      - run: npm run ci:workflow:check
      - run: npm run ci:action-pins:verify
      - run: npm run docs:governance:check
      - run: bash -n scripts/check-runtime-host.sh
      - run: bash -n scripts/backup-postgres.sh
      - run: bash -n scripts/test-postgres-backup-direct.sh
      - run: bash -n scripts/restore-postgres-drill.sh
      - run: bash -n scripts/test-postgres-restore-drill.sh
      - run: bash -n scripts/backup-runtime-gateway-state.sh
      - run: bash -n scripts/restore-runtime-gateway-state-drill.sh
      - run: bash -n scripts/verify-postgres-backup.sh
      - run: bash -n scripts/verify-runtime-gateway-state-backup.sh
      - run: bash scripts/check-runtime-host.sh --help
      - run: npm run deploy:check -- --allow-placeholders
      - run: npm run release:workflow:check
      - run: npm run backup:automation:check
      - run: npm run control-plane:compose:check
      - run: npm run runtime:compose:check
      - run: npm run console:page-auth:check
      - run: npm run console:security-headers:check
      - run: npm run console:client-requests:check
      - run: npm run membership:authz:check
      - run: npm run membership:scopes:check
      - run: npm run governance:tenant-scope:check
      - run: npm run governance:immutability:check
      - run: npm run program:revisions:check
      - run: npm run program:runtime-scripts:check
      - run: npm run runtime:program-transition:check
      - run: npm run control-room:program-transition:check
      - run: npm run runtime:program-output:check
      - run: npm run preflight:check
      - run: npm run lifecycle:authz:check
      - run: npm run command:confirmation:check
      - run: npm run service-ingest:auth:check
      - run: npm run service-principals:check
      - run: npm run start:ack:check
      - run: npm run runtime:watchdog:check
      - run: npm run runtime:outbox:check
      - run: npm run runtime:telemetry-alerts:check
      - run: npm run entitlement:check
      - run: npm run runtime:media:check
      - run: npm run runtime:voice:check
      - run: npm run runtime:journal:check
      - run: npm run runtime:preview:check
      - run: npm run media:evidence:check
      - run: npm run recording:evidence:check
      - run: npm run runtime:images:check
      - run: npm run runtime:images:licenses:check
      - run: npm run output-probe:response:check
      - run: npm run channel:verification:check
      - run: npm run settlement:reconciliation:check
      - run: npm run alert-notifier:health:check
      - run: npm run db:migrations:lint
      - run: npm run db:migrations:lint:extra
      - run: npm run regression:registry:check
      - run: node --check apps/runtime-worker/index.mjs
      - run: node --check apps/runtime-observer/index.mjs
      - run: node --check apps/runtime-observer/targets.mjs
      - run: node --check apps/output-probe/index.mjs
      - run: node --check apps/channel-adapter/index.mjs
      - run: node --check apps/alert-notifier/index.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  node-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Full history: regression:registry:test asserts REG-COMMIT, which the gate only reports as an error
          # when fixCommit can be looked up (a shallow clone turns it into a NOTE).
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run deploy:check:test
      - run: npm run deploy:manifest:test
      - run: npm run deploy:images:test
      - run: npm run runtime:images:licenses:test
      - run: npm run release:evidence:test
      - run: bash scripts/test-postgres-backup-direct.sh
      - run: bash scripts/test-postgres-restore-drill.sh
      - run: npm run policy:red-team
      - run: npm run runtime:worker:config:test
      - run: npm run runtime:worker:health:test
      - run: npm run runtime:acceptance:test
      - run: npm run observer:runtime:test
      - run: npm run observer:targets:test
      - run: npm run observer:targets:apply:test
      - run: npm run output-probe:test
      - run: npm run output-probe:config:test
      - run: npm run channel-adapter:test
      - run: npm run alert-notifier:test
      - run: npm run ci:gates:test
      - run: npm run ci:db-fail-closed:test
      - run: npm run ci:evidence:test
      - run: npm run release:workflow:gate:test
      - run: npm run release:environment:test
      - run: npm run docs:governance:test
      - run: npm run integration:lib:test
      - run: npm run db:migrations:lint:test
      - run: npm run regression:registry:test
      - run: npm run regression:evidence:test

  python-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python3 -m pip install --disable-pip-version-check --no-cache-dir --require-hashes -r runtime/gateway/requirements.lock
      - run: npm run runtime:gateway:config:test
      - run: npm run runtime:gateway:errors:test
      - run: python3 -m py_compile runtime/gateway/*.py scripts/test-runtime-gateway-config.py
      - run: python3 scripts/test-runtime-gateway-audio.py
      - run: python3 scripts/test-runtime-gateway-concurrency.py
      - run: python3 scripts/test-runtime-gateway-state-backup.py
      - run: python3 scripts/test-runtime-gateway-state-restore-drill.py

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shuzhiren
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shuzhiren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shuzhiren
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate:integrity:test
      - run: npm run service-principals:integration
      - run: npm run db:migrate:lock:test
      - run: npm run db:migrate:owner-model:test
      - run: npm run postgres:integration
      - run: npm run db:verify -- --allow-privileged
      - name: "prep: build console for control-plane integration"
        run: npm run build
      - run: npm run control-plane:integration
        env:
          RUN_CONTROL_PLANE_INTEGRATION_TESTS: "true"

  compose-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: docker compose --env-file config/control-plane-compose.example.env -f infra/compose/docker-compose.control-plane.yml config
        env:
          CONTROL_PLANE_ENV_FILE: ../../config/control-plane.example.env
          MIGRATION_OWNER_ENV_FILE: ../../config/control-plane-migration-owner.example.env
      - run: docker compose --env-file config/runtime.example.env --env-file config/runtime-gateway.example.env --env-file config/channel-adapter.example.env --env-file config/alert-notifier.example.env --profile output-probe --profile channel-adapter --profile alert-notifier --profile cosyvoice -f infra/compose/docker-compose.runtime.yml config

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: "prep: free runner disk"
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: docker build --file apps/console/Dockerfile --tag shuzhiren-control-plane-ci .
      - run: docker build --file apps/console/Dockerfile --target migrator --tag shuzhiren-control-plane-migrator-ci .
      - run: docker build --file apps/runtime-worker/Dockerfile --tag shuzhiren-runtime-worker-ci .
      - run: docker build --file apps/runtime-observer/Dockerfile --tag shuzhiren-runtime-observer-ci .
      - run: docker build --file apps/output-probe/Dockerfile --tag shuzhiren-output-probe-ci .
      - run: docker build --file apps/channel-adapter/Dockerfile --tag shuzhiren-channel-adapter-ci .
      - run: docker build --file apps/alert-notifier/Dockerfile --tag shuzhiren-alert-notifier-ci .
      - run: docker build --file runtime/gateway/Dockerfile --tag shuzhiren-runtime-gateway-ci runtime/gateway
      - run: docker build --load --file runtime/livetalking/Dockerfile --tag shuzhiren/livetalking:ci .
      - run: node scripts/check-runtime-image-licenses.mjs --livetalking-image shuzhiren/livetalking:ci
      - name: "prep: reclaim disk before CosyVoice build"
        run: docker image rm shuzhiren/livetalking:ci && docker builder prune --all --force && df -h /
      - name: docker build runtime/cosyvoice (committed Miniforge pin)
        run: |
          url="$(jq -er '.url' runtime/cosyvoice/miniforge.json)"
          sha="$(jq -er '.sha256' runtime/cosyvoice/miniforge.json)"
          docker build --file runtime/cosyvoice/Dockerfile --build-arg MINIFORGE_URL="$url" --build-arg MINIFORGE_SHA256="$sha" --tag shuzhiren-cosyvoice-ci .
      - run: node scripts/check-runtime-image-licenses.mjs --cosyvoice-image shuzhiren-cosyvoice-ci

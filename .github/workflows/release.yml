name: Release Images

# No workflow_dispatch inputs (audit H1, Requirement 13): the registry, the
# image namespace and the signing configuration are variables of the
# release-production environment, and the Miniforge installer pin is the
# reviewed runtime/cosyvoice/miniforge.json. `run:` steps contain no `${{ }}`
# expression; every dynamic value reaches the shell through `env:` and is read
# as "$NAME". scripts/release-environment.mjs validates the variables at run
# time and names only the variable, never its value, on failure.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: shuzhiren-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref_protected
    runs-on: ubuntu-24.04
    environment: release-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: CONTROL_PLANE_IMAGE
            image: control-plane
            context: .
            dockerfile: apps/console/Dockerfile
            target: runner
          - key: CONTROL_PLANE_MIGRATOR_IMAGE
            image: control-plane-migrator
            context: .
            dockerfile: apps/console/Dockerfile
            target: migrator
          - key: RUNTIME_GATEWAY_IMAGE
            image: runtime-gateway
            context: runtime/gateway
            dockerfile: runtime/gateway/Dockerfile
            target: ""
          - key: RUNTIME_WORKER_IMAGE
            image: runtime-worker
            context: .
            dockerfile: apps/runtime-worker/Dockerfile
            target: ""
          - key: RUNTIME_OBSERVER_IMAGE
            image: runtime-observer
            context: .
            dockerfile: apps/runtime-observer/Dockerfile
            target: ""
          - key: OUTPUT_PROBE_IMAGE
            image: output-probe
            context: .
            dockerfile: apps/output-probe/Dockerfile
            target: ""
          - key: CHANNEL_ADAPTER_IMAGE
            image: channel-adapter
            context: .
            dockerfile: apps/channel-adapter/Dockerfile
            target: ""
          - key: ALERT_NOTIFIER_IMAGE
            image: alert-notifier
            context: .
            dockerfile: apps/alert-notifier/Dockerfile
            target: ""
          - key: LIVETALKING_IMAGE
            image: livetalking
            context: .
            dockerfile: runtime/livetalking/Dockerfile
            target: ""
          - key: COSYVOICE_IMAGE
            image: cosyvoice
            context: .
            dockerfile: runtime/cosyvoice/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The registry must equal an entry of .github/release-registry-allowlist.json
      # character for character; a failure stops the job before docker/login-action.
      - name: Validate release registry
        id: validate-registry
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          RELEASE_IMAGE_NAMESPACE: ${{ vars.RELEASE_IMAGE_NAMESPACE }}
        run: node scripts/release-environment.mjs registry --allowlist .github/release-registry-allowlist.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.RELEASE_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # RELEASE_REVISION for every image; COSYVOICE_IMAGE also gets the Miniforge
      # URL and SHA-256 from runtime/cosyvoice/miniforge.json.
      - name: Prepare build arguments
        id: build-args
        env:
          MATRIX_KEY: ${{ matrix.key }}
        run: node scripts/release-environment.mjs build-args --matrix-key "$MATRIX_KEY" --miniforge runtime/cosyvoice/miniforge.json
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.RELEASE_REGISTRY }}/${{ vars.RELEASE_IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: ${{ steps.build-args.outputs.value }}
          sbom: true
          provenance: mode=max
      - name: Write image result
        env:
          MATRIX_KEY: ${{ matrix.key }}
          IMAGE_REPOSITORY: ${{ vars.RELEASE_REGISTRY }}/${{ vars.RELEASE_IMAGE_NAMESPACE }}/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          node scripts/write-release-image-result.mjs
          --key "$MATRIX_KEY"
          --repository "$IMAGE_REPOSITORY"
          --digest "$IMAGE_DIGEST"
          --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/$MATRIX_KEY.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ matrix.key }}
          path: ${{ runner.temp }}/${{ matrix.key }}.json
          if-no-files-found: error
          retention-days: 30

  assemble-and-sign:
    if: github.ref_protected
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, shuzhiren-release]
    environment: release-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-image-results
          merge-multiple: true
      # The evidence assembler sends the registry credentials to RELEASE_REGISTRY,
      # so the allowlist check runs here as well.
      - name: Validate release registry
        id: validate-registry
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          RELEASE_IMAGE_NAMESPACE: ${{ vars.RELEASE_IMAGE_NAMESPACE }}
        run: node scripts/release-environment.mjs registry --allowlist .github/release-registry-allowlist.json
      # Runs before evidence assembly and signing: an undefined or empty variable
      # fails the job and no Release_Manifest is created.
      - name: Validate signing configuration
        id: validate-signing
        env:
          RELEASE_SIGNING_KEY_PATH: ${{ vars.RELEASE_SIGNING_KEY_PATH }}
          RELEASE_ISSUER: ${{ vars.RELEASE_ISSUER }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: node scripts/release-environment.mjs signing
      # The assembler reads every image's SBOM and provenance attestation by
      # digest from the validated release registry (audit M21).
      - name: Assemble release evidence
        env:
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          REGISTRY_READ_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_READ_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: >-
          node scripts/assemble-release-evidence.mjs
          --input-dir "$RUNNER_TEMP/release-image-results"
          --revision "$GITHUB_SHA"
          --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --images-output "$RUNNER_TEMP/images.json"
          --sbom-output "$RUNNER_TEMP/release-sbom-index.json"
          --provenance-output "$RUNNER_TEMP/release-provenance-index.json"
      - name: Create signed release manifest
        env:
          RELEASE_SIGNING_KEY_PATH: ${{ vars.RELEASE_SIGNING_KEY_PATH }}
          RELEASE_ISSUER: ${{ vars.RELEASE_ISSUER }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: >-
          node scripts/create-deployment-release-manifest.mjs
          --images "$RUNNER_TEMP/images.json"
          --sbom "$RUNNER_TEMP/release-sbom-index.json"
          --provenance "$RUNNER_TEMP/release-provenance-index.json"
          --private-key "$RELEASE_SIGNING_KEY_PATH"
          --issuer "$RELEASE_ISSUER"
          --key-id "$RELEASE_KEY_ID"
          --revision "$GITHUB_SHA"
          --output "$RUNNER_TEMP/deployment-release-manifest.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-release-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/images.json
            ${{ runner.temp }}/release-sbom-index.json
            ${{ runner.temp }}/release-provenance-index.json
            ${{ runner.temp }}/deployment-release-manifest.json
          if-no-files-found: error
          retention-days: 30

  <rect x="88" y="1130" width="904" height="128" rx="30" fill="#173f35"/>
  <text x="132" y="1210" fill="#f8f4e9" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="42" font-weight="800">样本价 ¥99.00</text>
  <text x="690" y="1208" fill="#b9dfcf" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="25">赠旅行装三件套</text>

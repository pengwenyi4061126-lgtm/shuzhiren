services:
  runtime-gateway:
    build:
      context: ../../runtime/gateway
    environment:
      LIVETALKING_BASE_URL: http://livetalking:8010
      COSYVOICE_BASE_URL: http://cosyvoice:50000
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SHARED_TOKEN:?set-in-runtime-env}
      RUNTIME_REQUEST_TIMEOUT_SECONDS: 15
      PROGRAM_AUDIOTYPE: ${PROGRAM_AUDIOTYPE:-0}
      FALLBACK_AUDIOTYPE: ${FALLBACK_AUDIOTYPE:-1}
      HUMAN_HANDOFF_AUDIOTYPE: ${HUMAN_HANDOFF_AUDIOTYPE:-2}
    ports:
      - "8090:8090"
    depends_on:
      livetalking:
        condition: service_started

  runtime-worker:
    build:
      context: ../..
      dockerfile: apps/runtime-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?set-in-control-plane-env}
      RUNTIME_GATEWAY_URL: http://runtime-gateway:8090
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SHARED_TOKEN:?set-in-runtime-env}
      OUTBOX_POLL_MS: 1000
      SCHEDULER_POLL_MS: 1000
      SCHEDULER_BATCH_SIZE: 10
      OUTBOX_MAX_ATTEMPTS: 6
    depends_on:
      runtime-gateway:
        condition: service_started

  livetalking:
    build:
      context: ../..
      dockerfile: runtime/livetalking/Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    command: >-
      python3 app.py --transport rtmp --model musetalk --avatar_id ${LIVETALKING_AVATAR_ID:?set-in-runtime-env}
      --listenport 8010 --max_session 1 --push_url ${STREAM_RTMP_URL:?set-in-runtime-env}/${STREAM_KEY:?set-in-runtime-env}
    volumes:
      - ${MODEL_VOLUME_PATH:?set-in-runtime-env}:/app/models:ro
      - ${AVATAR_VOLUME_PATH:?set-in-runtime-env}:/app/data/avatars:ro
      - recordings:/app/data/record
    expose:
      - "8010"

  cosyvoice:
    profiles: ["cosyvoice"]
    build:
      context: ../../vendor/CosyVoice
      dockerfile: runtime/python/Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    command: >-
      /bin/bash -c "cd /opt/CosyVoice/CosyVoice/runtime/python/fastapi && python3 server.py --port 50000 --model_dir ${COSYVOICE_MODEL_DIR:?set-in-runtime-env}"
    volumes:
      - ${COSYVOICE_MODEL_PATH:?set-in-runtime-env}:/opt/CosyVoice/CosyVoice/pretrained_models:ro
    expose:
      - "50000"

volumes:
  recordings:

services:
  runtime-gateway:
    image: ${RUNTIME_GATEWAY_IMAGE:?set-in-runtime-env}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      LIVETALKING_BASE_URL: http://livetalking:8010
      COSYVOICE_BASE_URL: http://cosyvoice:50000
      COSYVOICE_SAMPLE_RATE: ${COSYVOICE_SAMPLE_RATE:-24000}
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SHARED_TOKEN:?set-in-runtime-env}
      RUNTIME_REQUEST_TIMEOUT_SECONDS: ${RUNTIME_REQUEST_TIMEOUT_SECONDS:-15}
      COSYVOICE_REQUIRED: ${COSYVOICE_REQUIRED:-false}
      MEDIA_COMMAND_CACHE_TTL_SECONDS: ${MEDIA_COMMAND_CACHE_TTL_SECONDS:-3600}
      MEDIA_COMMAND_CACHE_MAX_ENTRIES: ${MEDIA_COMMAND_CACHE_MAX_ENTRIES:-2048}
      RUNTIME_COMMAND_JOURNAL_PATH: /var/lib/shuzhiren-runtime/commands.sqlite3
      RUNTIME_COMMAND_JOURNAL_REQUIRED: "true"
      PREVIEW_BROKER_URL: ${PREVIEW_BROKER_URL:-}
      PREVIEW_BROKER_TOKEN: ${PREVIEW_BROKER_TOKEN:-}
      PREVIEW_GRANT_MAX_SECONDS: ${PREVIEW_GRANT_MAX_SECONDS:-600}
      PROGRAM_AUDIOTYPE: ${PROGRAM_AUDIOTYPE:-0}
      FALLBACK_AUDIOTYPE: ${FALLBACK_AUDIOTYPE:-1}
      HUMAN_HANDOFF_AUDIOTYPE: ${HUMAN_HANDOFF_AUDIOTYPE:-2}
    runtime: nvidia
    restart: unless-stopped
    # default: callers and the published port; runtime-media: the only route to LiveTalking and CosyVoice.
    networks: [default, runtime-media]
    ports:
      - "${RUNTIME_GATEWAY_HOST_BIND:-127.0.0.1}:8090:8090"
    volumes:
      - ${RUNTIME_GATEWAY_STATE_PATH:?set-in-runtime-gateway-env}:/var/lib/shuzhiren-runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      livetalking:
        condition: service_healthy

  runtime-worker:
    image: ${RUNTIME_WORKER_IMAGE:?set-in-runtime-env}
    environment:
      DATABASE_URL: ${RUNTIME_WORKER_DATABASE_URL:?set-in-runtime-env}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-5000}
      RUNTIME_GATEWAY_URL: http://runtime-gateway:8090
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SHARED_TOKEN:?set-in-runtime-env}
      RUNTIME_GATEWAY_REQUEST_TIMEOUT_MS: ${RUNTIME_GATEWAY_REQUEST_TIMEOUT_MS:-20000}
      CHANNEL_ADAPTER_URL: ${CHANNEL_ADAPTER_URL:-http://channel-adapter:${CHANNEL_ADAPTER_PORT:-8082}}
      CHANNEL_ADAPTER_DISPATCH_TOKEN: ${CHANNEL_ADAPTER_DISPATCH_TOKEN:?set-in-runtime-env}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      SCHEDULER_POLL_MS: ${SCHEDULER_POLL_MS:-1000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-10}
      RUNTIME_WATCHDOG_POLL_MS: ${RUNTIME_WATCHDOG_POLL_MS:-5000}
      RUNTIME_WATCHDOG_BATCH_SIZE: ${RUNTIME_WATCHDOG_BATCH_SIZE:-10}
      RUNTIME_TELEMETRY_MAX_AGE_SECONDS: ${RUNTIME_TELEMETRY_MAX_AGE_SECONDS:-60}
      USAGE_METER_POLL_MS: ${USAGE_METER_POLL_MS:-60000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-6}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      OUTBOX_RETRY_BASE_MS: ${OUTBOX_RETRY_BASE_MS:-1000}
      OUTBOX_RETRY_MAX_MS: ${OUTBOX_RETRY_MAX_MS:-60000}
      RUNTIME_WORKER_PORT: ${RUNTIME_WORKER_PORT:-8080}
    restart: unless-stopped
    expose:
      - "${RUNTIME_WORKER_PORT:-8080}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${RUNTIME_WORKER_PORT:-8080}/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      runtime-gateway:
        condition: service_healthy

  runtime-observer:
    image: ${RUNTIME_OBSERVER_IMAGE:?set-in-runtime-env}
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set-in-runtime-env}
      RUNTIME_GATEWAY_URL: http://runtime-gateway:8090
      RUNTIME_SHARED_TOKEN: ${RUNTIME_SHARED_TOKEN:?set-in-runtime-env}
      RUNTIME_OBSERVER_POLL_MS: ${RUNTIME_OBSERVER_POLL_MS:-5000}
      RUNTIME_OBSERVER_TIMEOUT_MS: ${RUNTIME_OBSERVER_TIMEOUT_MS:-3000}
      RUNTIME_OBSERVER_FAIL_CLOSED: ${RUNTIME_OBSERVER_FAIL_CLOSED:-true}
      RUNTIME_OBSERVER_PORT: ${RUNTIME_OBSERVER_PORT:-8084}
      RUNTIME_OBSERVER_TARGETS: ${RUNTIME_OBSERVER_TARGETS:-[]}
      RUNTIME_OBSERVER_TARGETS_FILE: /run/shuzhiren/observer-config/runtime-observer-targets.json
    restart: unless-stopped
    volumes:
      - ${RUNTIME_OBSERVER_TARGETS_DIR:-../../config}:/run/shuzhiren/observer-config:ro
    expose:
      - "${RUNTIME_OBSERVER_PORT:-8084}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${RUNTIME_OBSERVER_PORT:-8084}/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      runtime-gateway:
        condition: service_healthy

  output-probe:
    profiles: ["output-probe"]
    restart: unless-stopped
    image: ${OUTPUT_PROBE_IMAGE:?set-in-runtime-env}
    environment:
      OUTPUT_PROBE_SHARED_TOKEN: ${OUTPUT_PROBE_SHARED_TOKEN:-}
      OUTPUT_PROBE_TARGETS: ${OUTPUT_PROBE_TARGETS:-[]}
      OUTPUT_PROBE_TIMEOUT_MS: ${OUTPUT_PROBE_TIMEOUT_MS:-5000}
      OUTPUT_PROBE_CACHE_MS: ${OUTPUT_PROBE_CACHE_MS:-3000}
      OUTPUT_PROBE_AUDIO_SAMPLE_SECONDS: ${OUTPUT_PROBE_AUDIO_SAMPLE_SECONDS:-5}
      OUTPUT_PROBE_SILENCE_DURATION_SECONDS: ${OUTPUT_PROBE_SILENCE_DURATION_SECONDS:-2}
      OUTPUT_PROBE_SILENCE_THRESHOLD_DB: ${OUTPUT_PROBE_SILENCE_THRESHOLD_DB:--50}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  channel-adapter:
    profiles: ["channel-adapter"]
    restart: unless-stopped
    image: ${CHANNEL_ADAPTER_IMAGE:?set-in-runtime-env}
    environment:
      DATABASE_URL: ${CHANNEL_ADAPTER_DATABASE_URL:?set-in-channel-adapter-env}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-5000}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:?set-in-runtime-env}
      CHANNEL_ADAPTER_PORT: ${CHANNEL_ADAPTER_PORT:-8082}
      CHANNEL_ADAPTER_REPLAY_LEASE_SECONDS: ${CHANNEL_ADAPTER_REPLAY_LEASE_SECONDS:-60}
      CHANNEL_ADAPTER_MAX_REQUESTS_PER_MINUTE: ${CHANNEL_ADAPTER_MAX_REQUESTS_PER_MINUTE:-120}
      CHANNEL_ADAPTER_DISPATCH_TOKEN: ${CHANNEL_ADAPTER_DISPATCH_TOKEN:?set-in-runtime-env}
      CHANNEL_ADAPTER_TARGETS: ${CHANNEL_ADAPTER_TARGETS:-[]}
    expose:
      - "${CHANNEL_ADAPTER_PORT:-8082}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${CHANNEL_ADAPTER_PORT:-8082}/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  alert-notifier:
    profiles: ["alert-notifier"]
    restart: unless-stopped
    image: ${ALERT_NOTIFIER_IMAGE:?set-in-runtime-env}
    environment:
      DATABASE_URL: ${ALERT_NOTIFIER_DATABASE_URL:?set-in-alert-notifier-env}
      DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-5000}
      ALERT_NOTIFIER_PORT: ${ALERT_NOTIFIER_PORT:-8083}
      ALERT_NOTIFIER_POLL_MS: ${ALERT_NOTIFIER_POLL_MS:-5000}
      ALERT_NOTIFIER_LEASE_SECONDS: ${ALERT_NOTIFIER_LEASE_SECONDS:-60}
      ALERT_NOTIFIER_MAX_ATTEMPTS: ${ALERT_NOTIFIER_MAX_ATTEMPTS:-6}
      ALERT_NOTIFIER_RETRY_BASE_MS: ${ALERT_NOTIFIER_RETRY_BASE_MS:-1000}
      ALERT_NOTIFIER_RETRY_MAX_MS: ${ALERT_NOTIFIER_RETRY_MAX_MS:-60000}
      ALERT_NOTIFIER_TARGETS: ${ALERT_NOTIFIER_TARGETS:-[]}
    expose:
      - "${ALERT_NOTIFIER_PORT:-8083}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${ALERT_NOTIFIER_PORT:-8083}/healthz').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  livetalking:
    image: ${LIVETALKING_IMAGE:?set-in-runtime-env}
    runtime: nvidia
    restart: unless-stopped
    # Unauthenticated API: reachable only from runtime-gateway; livetalking-egress carries the RTMP push.
    networks: [runtime-media, livetalking-egress]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    command: >-
      python3 app.py --transport rtmp --model musetalk --avatar_id ${LIVETALKING_AVATAR_ID:?set-in-runtime-gateway-env}
      --listenport 8010 --max_session 1 --fps ${STREAM_FPS:-25}
      --push_url ${STREAM_RTMP_URL:?set-in-runtime-env} --stream_key_file /run/secrets/stream-key
    # The stream key never enters argv, the environment or rendered Compose: it is a
    # read-only file that the image launcher validates and LiveTalking appends to
    # --push_url in memory (logs and HTTP responses are redacted).
    secrets:
      - source: stream_key
        target: stream-key
    volumes:
      - ${MODEL_VOLUME_PATH:?set-in-runtime-gateway-env}:/app/models:ro
      - ${AVATAR_VOLUME_PATH:?set-in-runtime-gateway-env}:/app/data/avatars:ro
      - ${RECORDINGS_VOLUME_PATH:?set-in-runtime-gateway-env}:/app/data/record
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python3", "-c", "import json, urllib.request; response = json.load(urllib.request.urlopen('http://localhost:8010/api/admin/sessions', timeout=3)); assert response.get('code') == 0"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  cosyvoice:
    profiles: ["cosyvoice"]
    restart: unless-stopped
    image: ${COSYVOICE_IMAGE:?set-in-runtime-env}
    runtime: nvidia
    # Unauthenticated API without egress: reachable only from runtime-gateway.
    networks: [runtime-media]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    command: >-
      /bin/bash -c "cd /opt/CosyVoice/CosyVoice/runtime/python/fastapi && python3 server.py --port 50000 --model_dir ${COSYVOICE_MODEL_DIR:?set-in-runtime-gateway-env}"
    volumes:
      - ${COSYVOICE_MODEL_PATH:?set-in-runtime-gateway-env}:/opt/CosyVoice/CosyVoice/pretrained_models:ro
    expose:
      - "50000"

networks:
  # No default gateway: LiveTalking and CosyVoice cannot be reached from, or reach, anything but runtime-gateway here.
  runtime-media:
    internal: true
  livetalking-egress: {}

secrets:
  stream_key:
    # Host file holding only the stream key, readable by UID 10002 (for example
    # chown 10002:10002 and chmod 0400); deploy:check validates it.
    file: ${STREAM_KEY_FILE:?set-in-runtime-env}

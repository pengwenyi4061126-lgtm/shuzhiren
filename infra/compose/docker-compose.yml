services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shuzhiren
      POSTGRES_USER: shuzhiren
      POSTGRES_PASSWORD: replace-in-local-env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuzhiren -d shuzhiren"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: replace-in-local-env
      MINIO_ROOT_PASSWORD: replace-in-local-env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:
